name: Build tools
description: Set up Java, Python and Gradle
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: gradle/actions/setup-gradle@v6
