name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tasks: jvmTest jsNodeTest jsBrowserTest wasmJsNodeTest wasmJsBrowserTest
          - os: macos-26
            tasks: macosArm64Test iosSimulatorArm64Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test
        env:
          TEST_TASKS: ${{ matrix.tasks }}
        shell: bash
        run: |
          read -r -a tasks <<< "$TEST_TASKS"
          bash ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -PciPackaging=true "${tasks[@]}"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
          retention-days: 14
