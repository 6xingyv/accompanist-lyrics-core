name: Release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      deployment_id:
        description: Existing Maven deployment to finish after a publishing timeout
        required: false
        type: string
      source_run_id:
        description: Original Release run containing the verified packages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.deployment_id == ''
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$version" == *-SNAPSHOT ]]; then
            echo '::error::Use a release tag such as v0.5.0 or v0.6.0-rc.1'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Test and package all publications
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            "-PreleaseVersion=$VERSION" -PciPackaging=true \
            jvmTest macosArm64Test iosSimulatorArm64Test publishAllPublicationsToCiRepository
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          repository = Path('build/ci-maven/com/mocharealm/accompanist')
          targets = [('lyrics-core', 'pom'), ('lyrics-core-jvm', 'jar')]
          targets += [(f'lyrics-core-{target}', 'klib') for target in
                      ['js', 'wasm-js', 'macosx64', 'macosarm64', 'iosx64', 'iosarm64', 'iossimulatorarm64']]
          for module, suffix in targets:
              path = repository / module / version / f'{module}-{version}.{suffix}'
              if not path.is_file():
                  raise SystemExit(f'Missing publication: {path}')
          PY
          mkdir -p dist
          (cd build/ci-maven && zip -qr "../../dist/lyrics-core-$VERSION-maven.zip" .)
          (cd dist && shasum -a 256 -- *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: lyrics-core-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14
      - name: Publish to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" || -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" || -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]]; then
            echo '::error::Maven Central credentials and a signing key are required.'
            exit 1
          fi
          if [[ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          bash ./gradlew --no-daemon --max-workers=2 -PSONATYPE_CLOSE_TIMEOUT_SECONDS=3600 "-PreleaseVersion=$VERSION" \
            publishToMavenCentral

  resume:
    if: inputs.deployment_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      version: ${{ steps.status.outputs.version }}
      prerelease: ${{ steps.status.outputs.prerelease }}
    steps:
      - name: Verify the existing Maven deployment
        id: status
        env:
          TAG: ${{ inputs.tag }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          python3 -u - <<'PY'
          import base64, json, os, re, time
          from urllib.request import Request, urlopen
          version = os.environ['TAG'].removeprefix('v')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?', version):
              raise SystemExit('A version tag is required')
          if not re.fullmatch(r'[0-9a-f-]{36}', os.environ['DEPLOYMENT_ID']) or not os.environ['SOURCE_RUN_ID'].isdigit():
              raise SystemExit('Provide the existing deployment UUID and original Release run ID')
          credentials = f'{os.environ["MAVEN_USERNAME"]}:{os.environ["MAVEN_PASSWORD"]}'
          token = base64.b64encode(credentials.encode()).decode()
          deadline = time.monotonic() + 60 * 60
          while True:
              request = Request('https://central.sonatype.com/api/v1/publisher/status?id=' + os.environ['DEPLOYMENT_ID'],
                                data=b'', headers={'Authorization': 'Bearer ' + token}, method='POST')
              with urlopen(request, timeout=30) as response:
                  status = json.load(response)
              state = status['deploymentState']
              print('Existing Maven deployment:', state)
              if state == 'PUBLISHED':
                  expected = 'pkg:maven/com.mocharealm.accompanist/lyrics-core@' + version
                  if not any(purl.split('?')[0] == expected for purl in status.get('purls', [])):
                      raise SystemExit('Deployment does not contain the requested library version')
                  break
              if state == 'FAILED' or time.monotonic() >= deadline:
                  raise SystemExit(f'Maven deployment did not publish: {status}')
              time.sleep(30)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nprerelease={str("-" in version).lower()}\n')
          PY

  release:
    needs: [build, resume]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.resume.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lyrics-core-${{ needs.build.outputs.version || needs.resume.outputs.version }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Verify package checksums
        shell: bash
        run: (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease || needs.resume.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft > release.json; then
            if [[ "$(jq -r .isDraft release.json)" != true ]]; then
              echo '::error::This tag already has a published release.'
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
